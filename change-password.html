<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-doc="cp.doc">غيّر كلمة السر — عاش يا وحش</title>
<meta name="description" content="غيّر كلمة السر — عاش يا وحش">
<meta name="theme-color" content="#394F9F">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=4">
<script>try{if(matchMedia('(prefers-reduced-motion: no-preference)').matches)document.documentElement.classList.add('motion')}catch(e){}</script>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>

<a class="skip" href="#main" data-i18n="skip.link">تخطَّ للمحتوى</a>

<header class="site-header">
  <div class="wrap site-header__in">
    <a class="brand" href="index.html">
      <img class="brand__logo" src="assets/logo-sm.png" width="360" height="207"
           alt="عاش يا وحش" data-i18n-alt="brand.name">
      <small class="brand__tag" data-i18n="brand.tagline">ناس مننا مكملة في التغيير للأحسن</small>
    </a>
    <button type="button" class="lang" data-lang-toggle data-i18n-aria="lang.switch.aria">
      <svg class="lang__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>
      </svg>
      <span data-i18n="lang.switch">English</span>
    </button>
  </div>
</header>

<main id="main" class="wrap doc auth">
  <h1 data-i18n="cp.title">غيّر كلمة السر</h1>
  <p class="auth__lead" id="cp-lead"></p>

  <form id="cp-form" class="form-card" novalidate>
    <input type="text" id="cp-user" autocomplete="username" dir="ltr" hidden readonly>

    <div class="field" data-field="current">
      <label class="field__label" for="cp-current" data-i18n="cp.current.label"></label>
      <p class="field__hint" id="h-cp-current" data-i18n="cp.current.hint"></p>
      <div class="pw">
        <input class="input" id="cp-current" type="password" maxlength="64" dir="ltr"
               autocomplete="current-password" autocapitalize="off" spellcheck="false"
               aria-describedby="h-cp-current e-current" aria-invalid="false">
        <button type="button" class="pw__toggle" data-pw-toggle="cp-current" aria-pressed="false"></button>
      </div>
      <p class="field__err" id="e-current" role="alert"></p>
    </div>

    <div class="field" data-field="new">
      <label class="field__label" for="cp-new" data-i18n="cp.new.label"></label>
      <div class="pw">
        <input class="input" id="cp-new" type="password" maxlength="64" dir="ltr"
               autocomplete="new-password" autocapitalize="off" spellcheck="false"
               aria-describedby="e-new" aria-invalid="false">
        <button type="button" class="pw__toggle" data-pw-toggle="cp-new" aria-pressed="false"></button>
      </div>
      <p class="field__err" id="e-new" role="alert"></p>
    </div>

    <div class="field" data-field="confirm">
      <label class="field__label" for="cp-confirm" data-i18n="cp.confirm.label"></label>
      <div class="pw">
        <input class="input" id="cp-confirm" type="password" maxlength="64" dir="ltr"
               autocomplete="new-password" autocapitalize="off" spellcheck="false"
               aria-describedby="e-confirm" aria-invalid="false">
        <button type="button" class="pw__toggle" data-pw-toggle="cp-confirm" aria-pressed="false"></button>
      </div>
      <p class="field__err" id="e-confirm" role="alert"></p>
    </div>

    <div class="rules-box">
      <p class="rules__title" data-i18n="pw.rules.title"></p>
      <ul class="rules" id="cp-rules">
        <li data-rule="len" data-i18n="pw.rule.len"></li>
        <li data-rule="ascii" data-i18n="pw.rule.ascii"></li>
        <li data-rule="phone" data-i18n="pw.rule.phone"></li>
        <li data-rule="diff" data-i18n="pw.rule.diff"></li>
        <li data-rule="match" data-i18n="pw.rule.match"></li>
      </ul>
    </div>

    <div id="cp-error" class="callout callout--error" hidden role="alert"><p id="cp-error-body"></p></div>

    <button type="submit" id="cp-submit" class="btn btn--primary btn--lg" data-i18n="cp.submit"></button>
    <p class="auth__links"><button type="button" id="cp-logout" class="btn btn--link" data-i18n="cp.logout"></button></p>
  </form>
</main>

<footer class="site-footer">
  <div class="wrap">
    <nav class="site-footer__nav" aria-label="footer">
      <a href="index.html" data-i18n="pp.back">رجوع للاستمارة</a>
      <a href="privacy.html" data-i18n="footer.privacy">سياسة الخصوصية</a>
    </nav>
    <p class="site-footer__note" data-i18n="footer.made"></p>
    <p class="site-footer__rights">© <span id="year"></span> <span data-i18n="footer.rights"></span></p>
  </div>
</footer>

<script src="config.js?v=4"></script>
<script src="i18n.js?v=4"></script>
<script src="common.js?v=4"></script>
<script src="change-password.js?v=4"></script>
</body>
</html>

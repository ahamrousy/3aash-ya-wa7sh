<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-doc="login.doc">دخول المشتركين — عاش يا وحش</title>
<meta name="description" content="دخول المشتركين في عاش يا وحش.">
<meta name="theme-color" content="#394F9F">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=4">
<script>try{if(matchMedia('(prefers-reduced-motion: no-preference)').matches)document.documentElement.classList.add('motion')}catch(e){}</script>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>

<a class="skip" href="#main" data-i18n="skip.link">تخطَّ للمحتوى</a>

<header class="site-header">
  <div class="wrap site-header__in">
    <a class="brand" href="index.html">
      <img class="brand__logo" src="assets/logo-sm.png" width="360" height="207"
           alt="عاش يا وحش" data-i18n-alt="brand.name">
      <small class="brand__tag" data-i18n="brand.tagline">ناس مننا مكملة في التغيير للأحسن</small>
    </a>
    <button type="button" class="lang" data-lang-toggle data-i18n-aria="lang.switch.aria">
      <svg class="lang__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>
      </svg>
      <span data-i18n="lang.switch">English</span>
    </button>
  </div>
</header>

<main id="main" class="wrap doc auth">
  <h1 data-i18n="login.title">دخول المشتركين</h1>
  <p class="auth__lead" data-i18n="login.lead"></p>

  <form id="login" class="form-card" novalidate>
    <div class="field" data-field="username">
      <label class="field__label" for="lg-num" data-i18n="login.user.label"></label>
      <p class="field__hint" id="h-lg-num" data-i18n="login.user.hint"></p>
      <div class="phone">
        <select class="input input--code" id="lg-code" data-i18n-aria="f.whatsapp.country"></select>
        <input class="input input--tel" id="lg-num" type="tel" inputmode="tel" maxlength="16" dir="ltr"
               autocomplete="username" autocapitalize="off" spellcheck="false"
               data-i18n-ph="f.whatsapp.ph" aria-describedby="h-lg-num e-username" aria-invalid="false">
      </div>
      <p class="field__err" id="e-username" role="alert"></p>
    </div>

    <div class="field" data-field="password">
      <label class="field__label" for="lg-pw" data-i18n="login.pw.label"></label>
      <p class="field__hint" id="h-lg-pw" data-i18n="login.pw.hint"></p>
      <div class="pw">
        <input class="input" id="lg-pw" type="password" maxlength="64" dir="ltr"
               autocomplete="current-password" autocapitalize="off" spellcheck="false"
               aria-describedby="h-lg-pw e-password" aria-invalid="false">
        <button type="button" class="pw__toggle" data-pw-toggle="lg-pw" aria-pressed="false"></button>
      </div>
      <p class="field__err" id="e-password" role="alert"></p>
    </div>

    <div id="lg-error" class="callout callout--error" hidden role="alert">
      <p id="lg-error-body"></p>
      <p id="lg-error-wa" hidden><a class="link" data-wa-coach target="_blank" rel="noopener" data-i18n="api.contact"></a></p>
    </div>

    <button type="submit" id="lg-submit" class="btn btn--primary btn--lg" data-i18n="login.submit"></button>

    <p class="auth__links">
      <a id="lg-forgot" target="_blank" rel="noopener" data-i18n="login.forgot"></a>
      <a href="index.html" data-i18n="login.register"></a>
    </p>
  </form>
</main>

<footer class="site-footer">
  <div class="wrap">
    <nav class="site-footer__nav" aria-label="footer">
      <a href="index.html" data-i18n="pp.back">رجوع للاستمارة</a>
      <a href="privacy.html" data-i18n="footer.privacy">سياسة الخصوصية</a>
    </nav>
    <p class="site-footer__note" data-i18n="footer.made"></p>
    <p class="site-footer__rights">© <span id="year"></span> <span data-i18n="footer.rights"></span></p>
  </div>
</footer>

<script src="config.js?v=4"></script>
<script src="i18n.js?v=4"></script>
<script src="common.js?v=4"></script>
<script src="login.js?v=4"></script>
</body>
</html>
